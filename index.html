<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="KORILIO">
  <meta name="theme-color" content="#bfe3f5">
  <title>KORILIO – Kaart en vlaggen</title>
  <link rel="stylesheet" href="css/style.css?v=7">
</head>
<body data-screen="menu" data-mode="">
  <div class="app">
    <header class="bar">
      <button class="icon-btn" id="home" type="button" aria-label="Menu">🏠</button>
      <h1 class="logo">KORILIO</h1>
      <div class="progress" id="progress" aria-live="polite"></div>
      <button class="icon-btn" id="sound-toggle" type="button" aria-label="Geluid aan">🔊</button>
    </header>

    <section class="menu" id="menu">
      <h2 class="menu-title">Kies een spel</h2>
      <div class="menu-cards">
        <button class="menu-card" type="button" data-mode="kaart">
          <span class="menu-pic">
            <svg id="menu-map" class="map-svg" aria-hidden="true" preserveAspectRatio="xMidYMid slice"></svg>
          </span>
          <span class="menu-label">Kaart</span>
        </button>
        <button class="menu-card" type="button" data-mode="vlaggen">
          <span class="menu-pic menu-flags" aria-hidden="true">
            <img src="flags/nl.svg" alt=""><img src="flags/be.svg" alt=""><img src="flags/fr.svg" alt=""><img src="flags/de.svg" alt="">
          </span>
          <span class="menu-label">Vlaggen</span>
        </button>
      </div>
    </section>

    <section class="menu" id="regions">
      <h2 class="menu-title" id="regions-title">Kies een werelddeel</h2>
      <div class="menu-cards region-cards" id="region-cards"></div>
    </section>

    <main class="stage">
      <div class="view map-wrap">
        <svg id="map" class="map-svg" role="img" aria-label="Kaart waarop één land oplicht"
             preserveAspectRatio="xMidYMid meet"></svg>
      </div>

      <div class="view flag-wrap">
        <div class="flag-frame">
          <img id="flag" alt="Vlag van een land" draggable="false">
        </div>
      </div>

      <section class="panel">
        <p class="prompt" id="prompt"></p>
        <div class="choices" id="choices"></div>
      </section>
    </main>

    <footer class="credit">Idee: <a href="https://x.com/DennisEssers" target="_blank" rel="noopener">@DennisEssers</a> · Kaart: jsvectormap © Mustafa Omar (MIT) · Vlaggen: flag-icons (MIT) · Applaus: Sandermotions (CC0)</footer>
  </div>

  <div class="overlay" id="summary" hidden>
    <div class="card">
      <div class="stars" id="summary-stars"></div>
      <h2 id="summary-title">Goed gedaan!</h2>
      <p id="summary-text"></p>
      <div class="card-buttons">
        <button class="big-btn" id="play-again" type="button">Nog een keer</button>
        <button class="big-btn secondary" id="summary-menu" type="button">Menu</button>
      </div>
    </div>
  </div>

  <div class="error-box" id="error-box" hidden></div>

  <script type="module" src="js/main.js?v=7"></script>
</body>
</html>
